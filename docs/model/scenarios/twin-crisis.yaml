experiment:
  id: twin-crisis
  model_version: economy-lab/1.0
  fidelity: F2
  horizon_years: 10
  warmup_years: 1
  seeds: [101, 102, 103, 104, 105]
  baseline_calibration: emerging_small_open_v1
  shocks:
    - variable: central_bank.base_money_target
      effective_period: 2030-01-01
      effective_tick: 30
      operation: multiply
      value: 1.10
    - variable: banks.default_probability
      effective_period: 2030-01-01
      effective_tick: 30
      operation: add
      value: 100
  outputs: [gdp_real, fx_nominal, credit, expected_loss, unemployment]
  stopping:
    long_run_equilibrium:
      window_months: 60
      max_abs_slope: 0.0001
      max_market_residual_ppm: 50
  hypothesis: EXP-07. A money jump and a default shock share one effective tick.
